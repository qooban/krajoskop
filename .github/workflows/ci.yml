name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing. Cancel it and keep the queue short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs rather than tags, per OpenSSF
      # Scorecard. Comments record which release each SHA is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run each check separately so the failing one is obvious from the job
      # summary without opening the log.
      - name: Formatting
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Types
        run: pnpm run typecheck
      - name: Tests
        run: pnpm run test

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - run: node tools/check-links.ts
